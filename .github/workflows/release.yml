name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        shell: pwsh
        run: |
          $env:VERSION = '${{ github.ref_name }}'.TrimStart('v')
          cmd /c build.cmd
          if (-not (Test-Path XonarU1.exe)) { exit 1 }
          Rename-Item XonarU1.exe XonarU1-Setup.exe

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' XonarU1-Setup.exe `
            --title '${{ github.ref_name }}' `
            --notes 'Download **XonarU1-Setup.exe** and run it. See the README for details.' `
            --generate-notes
