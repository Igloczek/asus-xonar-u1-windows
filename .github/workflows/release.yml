name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        shell: pwsh
        run: |
          $env:VERSION = $env:TAG.TrimStart('v')
          cmd /c build.cmd
          if (-not (Test-Path XonarU1.exe)) { exit 1 }
          Rename-Item XonarU1.exe XonarU1-Setup.exe

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG XonarU1-Setup.exe `
            --title $env:TAG `
            --notes 'Download **XonarU1-Setup.exe** and run it. See the README for details.' `
            --generate-notes
